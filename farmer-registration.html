<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-image: url('https://www.jaivikkheti.in/_nuxt/img/e75265e.jpg');
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        .form-container {
            position: absolute;
            max-height: 100vh;
            width: 50%;
            background-color: white;
            left: 75%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            overflow-x: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .form-container::-webkit-scrollbar {
            display: none;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #4CAF50;
        }

        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        form input,
        form select,
        form textarea {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #4CAF50;
            border-radius: 5px;
        }

        form button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        form button:hover {
            background-color: #45a049;
        }

        select {
            width: 98%;
        }

        .logo img {
            position: absolute;
            height: 30%;
            top: -5%;
            left: -1%;
            transform: rotate(-10deg);
        }

        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            width: 500px;
            height: 250px;
            position: relative;
        }

        .popup-content img {
            height: 100px;
            width: 100px;
        }

        .popup-content h3 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .popup-content p {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .popup-content button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .popup-content button:hover {
            background-color: #45a049;
        }
    </style>
    <script>
        function showPopup() {
            document.getElementById('popup').style.display = 'flex';
        }


    </script>
</head>

<body>
    <div class="logo">
        <img src="Gemini_Generated_Image_eh5zqqeh5zqqeh5z-removebg-preview.png" alt="">
    </div>
    <div class="form-container">
        <div class="container">
            <h1>Farmer Registration</h1>

            <form onsubmit="event.preventDefault(); showPopup();">
                <!-- Personal Information -->
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

                <label for="identity-proof-type">Select Identity Proof Type</label>
                <select style="width:101%" id="identity-proof-type" name="identity_proof_type" required>
                    <option value="">-- Select --</option>
                    <option value="aadhar">Aadhar Card</option>
                    <option value="driving-license">Driving License</option>
                    <option value="pancard">PAN Card</option>
                </select>

                <label for="identity-proof-image">Upload Identity Proof Image</label>
                <input type="file" id="identity-proof-image" name="identity_proof_image" accept="image/*" required
                    onchange="validateFileSize(this)">

                <!-- Farm Information -->
                <label for="farm-location">Farm Location</label>
                <textarea id="farm-location" name="farm_location" placeholder="Enter your farm address" rows="3"
                    required></textarea>

                <label for="farm-type">Type of Farming</label>
                <select style="width:101%" id="farm-type" name="farm_type" required>
                    <option value="">-- Select --</option>
                    <option value="organic">Organic</option>
                    <option value="traditional">Traditional</option>
                    <option value="livestock">Livestock</option>
                    <option value="mixed">Mixed Farming</option>
                </select>

                <label for="products">Main Products</label>
                <input type="text" id="products" name="products" placeholder="e.g., Vegetables, Fruits, Dairy" required>

                <label for="product-image">Upload Product Image</label>
                <input type="file" id="product-image" name="product_image" accept="image/*" required
                    onchange="validateFileSize(this)">

                <!-- Submit -->
                <button type="submit">Register</button>
            </form>
        </div>
    </div>
    <div id="popup" class="popup">
        <div class="popup-content">
            <h3>You are under review!</h3>
            <img src="green_eco_loop_leaf_check_mark.jpg" alt="">

            <p>Our team will contact you soon.</p>
            <button onclick="redirectToNextPage()">OK</button>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-storage.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCfQoSWrD3MgszZk7bUKVuOQGrHm8lQNgY",
            authDomain: "finalyearproject-c903e.firebaseapp.com",
            projectId: "finalyearproject-c903e",
            storageBucket: "finalyearproject-c903e.appspot.com",
            messagingSenderId: "973186077279",
            appId: "1:973186077279:web:ee54875cad164d43d841ea",
            measurementId: "G-MQK78X673M"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Handle form submission
        const form = document.querySelector("form");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            // Collect form data
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const identityProofType = document.getElementById("identity-proof-type").value;
            const farmLocation = document.getElementById("farm-location").value;
            const farmType = document.getElementById("farm-type").value;
            const products = document.getElementById("products").value;

            // Collect files
            const identityProofFile = document.getElementById("identity-proof-image").files[0];
            const productImageFile = document.getElementById("product-image").files[0];

            try {
                // Upload files to Firebase Storage
                const identityProofRef = ref(storage, `identityProofs/${identityProofFile.name}`);
                await uploadBytes(identityProofRef, identityProofFile);

                const productImageRef = ref(storage, `productImages/${productImageFile.name}`);
                await uploadBytes(productImageRef, productImageFile);

                // Save form data to Firestore
                const docRef = doc(db, "farmerRegistrations", email); // Use email as a unique document ID
                await setDoc(docRef, {
                    name,
                    email,
                    phone,
                    identityProofType,
                    identityProofURL: `identityProofs/${identityProofFile.name}`,
                    farmLocation,
                    farmType,
                    products,
                    productImageURL: `productImages/${productImageFile.name}`
                });

                alert("Form submitted successfully!");
            } catch (error) {
                console.error("Error submitting form:", error);
                alert("Error submitting form. Please try again.");
            }
        });
    </script>

</body>

</html>
