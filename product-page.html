    }

    <script>    // Display selected product details on the main product page
        const productData = JSON.parse(localStorage.getItem('selectedforproductpage'));

        if (productData) {
            // Display product data
            document.getElementById('product-image').src = productData.image;
            document.getElementById('product-name').textContent = productData.name;
            document.getElementById('product-price').textContent = productData.price;
        } else {
            alert('No product data found!');
            window.location.href = 'home.html'; // Redirect to home if no product data
        }

        // Function to add a product to the cart
        function addToCart(event) {
            const productDiv = event.target.closest('.buy-now-container') || event.target.closest('.submenu');

            // Extract product details
            const image = productDiv.querySelector('img').src;
            const name = productDiv.querySelector('h1')
                ? productDiv.querySelector('h1').textContent.trim()
                : productDiv.querySelector('p').textContent.trim();
            const price = productDiv.querySelector('.price')
                ? productDiv.querySelector('.price').textContent.trim()
                : productDiv.querySelector('h3').textContent.trim();

            // Prepare product object
            const product = { image, name, price };

            // Get existing cart items from localStorage
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            // Check if product already exists in the cart
            const isProductInCart = cart.some(item => item.name === product.name);

            if (!isProductInCart) {
                cart.push(product);
                localStorage.setItem('cart', JSON.stringify(cart));

                cartAnimation.classList.add('show', 'bounce');

                // Hide animation after 2 seconds
                setTimeout(() => {
                    cartAnimation.classList.remove('show', 'bounce');
                }, 2000);
                window.location.href='new_cart.html';
            } else {
                alert('This item is already in your cart.');
            }
        }

        // Attach event listener to "Add to Cart" button on the main product
        const mainAddToCartButton = document.querySelector('.buy-now-container .add-to-cart-btn');
        if (mainAddToCartButton) {
            mainAddToCartButton.addEventListener('click', addToCart);
        }

        // Attach event listeners to related products' "Add to Cart" buttons
        document.querySelectorAll('.submenu .add-to-cart-btn').forEach(button => {
            button.addEventListener('click', addToCart);
        });
    </script>
