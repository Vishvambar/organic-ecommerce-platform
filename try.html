<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .product-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: white;
        }
        .product-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ddd;
        }
        .product-image img {
            width: 80%;
            height: auto;
            border-radius: 10px;
        }
        .product-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
        }
        .product-title {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 28px;
            color: #28a745;
            margin-bottom: 15px;
        }
        .product-description {
            font-size: 20px;
            color: #555;
            margin-bottom: 20px;
        }
        .buy-button {
            background-color: #007bff;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            width: 200px;
        }
        .buy-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="product-container">
        <div class="product-image">
            <img src="product-image.jpg" alt="Product Image">
        </div>
        <div class="product-details">
            <h1 class="product-title">Product Name</h1>
            <p class="product-price">$99.99</p>
            <p class="product-description">This is a brief description of the product. It highlights key features and benefits.</p>
            <button class="buy-button">Buy Now</button>
        </div>
    </div>
</body>
</html>
